name: doors

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: doors-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: "1.34.1"
      OASDIFF_SHA256: 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install oasdiff
        run: |
          if ! python3 -c 'import sys, tomllib; sys.exit(not tomllib.load(open(".github/doors.toml", "rb")).get("contracts", {}).get("openapi"))'; then
            exit 0
          fi
          tarball="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${tarball}"
          echo "${OASDIFF_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" oasdiff
          sudo mv oasdiff /usr/local/bin/
      - name: Classify and advise
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: bash <(git show "$BASE:.github/scripts/doors.sh" 2>/dev/null || cat .github/scripts/doors.sh)

name: Enhancement
description: New or changed behaviour, planned work, hardening or debt.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues first. Write the title as one sentence a busy colleague could act on, with the
        error or whatever makes this case unusual. Before submitting, read the issue as someone without your context.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or costly today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, if any. Leave it empty when the approach is still open.
  - type: textarea
    id: related
    attributes:
      label: Related issues
      description: Issues or PRs you found that look similar, and why they don't cover this one.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The observable result that lets this issue close. Scope it so it can close.
    validations:
      required: true
